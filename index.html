<!-- Add this script to the end of each HTML file before closing </body> tag -->
<script>
// Entrance Animation on Load
window.addEventListener('load', function() {
    const pageContent = document.getElementById('page-content');
    if (pageContent) {
        pageContent.classList.add('animate-in');
    }
});

// Exit Animation on Click
document.addEventListener('click', function(e) {
    const link = e.target.closest('a');
    
    if (link && !link.hasAttribute('target') && !link.href.startsWith('mailto:')) {
        const isInternalLink = link.href.includes(window.location.hostname) || link.href.startsWith('./') || link.href.includes('.html');
        
        if (isInternalLink) {
            e.preventDefault();
            
            const pageContent = document.getElementById('page-content');
            if (pageContent) {
                pageContent.classList.remove('animate-in');
                pageContent.classList.add('animate-out');
                
                setTimeout(function() {
                    window.location.href = link.href;
                }, 600);
            }
        }
    }
});
</script>
